<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1000px; height:520px; background:#1e1e1e; font-family:'Segoe UI','Microsoft YaHei',sans-serif; overflow:hidden; }
  .titlebar { height:32px; background:#3c3c3c; color:#cccccc; font-size:12.5px; display:flex; align-items:center; padding:0 14px; }
  .wrap { display:flex; gap:0; padding:26px 30px; align-items:flex-start; }
  .pane { background:#1e1e1e; border:1px solid #333; border-radius:6px; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  .pane .head { background:#252526; color:#bbbbbb; font-size:11.5px; padding:6px 12px; border-bottom:1px solid #2b2b2b; }
  .code { font-family:Consolas,monospace; font-size:15px; line-height:24px; padding:12px 0; min-width:280px; }
  .ln { display:inline-block; width:40px; text-align:right; padding-right:12px; }
  .gm { display:inline-block; width:30px; text-align:center; }
  .ln1 { color:#858585; } .ln2 { color:#c6c6c6; }
  .moved { color:#e7e7e7; font-weight:600; }
  .ins { background:rgba(70,160,90,.25); }
  .bookmark-line { background:rgba(240,192,64,0.10); }
  .star { width:16px; height:16px; vertical-align:-2px; }
  .arrow-col { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 26px 0; color:#cccccc; }
  .arrow { font-size:34px; color:#3794ff; }
  .op { font-size:12px; color:#9d9d9d; margin-top:8px; text-align:center; line-height:1.6; }
  .note { margin:18px 30px 0; background:#252526; border:1px solid #454545; border-left:3px solid #f0c040; border-radius:4px; padding:11px 16px; font-size:12.5px; color:#cccccc; line-height:1.8; }
  .note b { color:#f0c040; }
</style>
</head>
<body>
  <div class="titlebar">书签跟随内容自动调整 (v1.17.0 设计原型)</div>
  <div class="wrap">
    <div class="pane">
      <div class="head">修改前</div>
      <div class="code">
        <div><span class="ln ln1">1</span><span class="gm"></span>aaa</div>
        <div class="bookmark-line"><span class="ln ln2">2</span><span class="gm"><svg class="star" viewBox="0 0 16 16"><path d="M4 1.5 h8 v13 l-4 -3.2 L4 14.5 z" fill="#f0c040" stroke="#f0c040" stroke-width="0.6"/></svg></span>bbb</div>
        <div><span class="ln ln1">3</span><span class="gm"></span>ccc</div>
      </div>
    </div>
    <div class="arrow-col">
      <div class="arrow">➜</div>
      <div class="op">在第 2 行前<br>插入一行 "aaa"<br><span style="color:#46a05a;">（或删除上方一行则反向）</span></div>
    </div>
    <div class="pane">
      <div class="head">修改后</div>
      <div class="code">
        <div><span class="ln ln1">1</span><span class="gm"></span>aaa</div>
        <div class="ins"><span class="ln ln1">2</span><span class="gm"></span>aaa <span style="color:#46a05a;font-size:11px;">← 新插入</span></div>
        <div class="bookmark-line"><span class="ln ln2 moved">3</span><span class="gm"><svg class="star" viewBox="0 0 16 16"><path d="M4 1.5 h8 v13 l-4 -3.2 L4 14.5 z" fill="#f0c040" stroke="#f0c040" stroke-width="0.6"/></svg></span>bbb</div>
        <div><span class="ln ln1">4</span><span class="gm"></span>ccc</div>
      </div>
    </div>
  </div>
  <div class="note">
    <b>规则</b>：书签锚定"内容"而非行号——上方插入行 → 书签随内容下移（2→3）；上方删除行 → 上移；同行内改字符/行未整删 → 书签保留；
    <b>书签行被整行删除 → 书签随之删除</b>（已确认）。撤销/重做（Ctrl+Z / Ctrl+Y）同样按此规则跟随。
  </div>
</body>
</html>
